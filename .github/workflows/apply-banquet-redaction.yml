name: Apply banquet contact redaction

on:
  push:
    branches:
      - feature/banquet-telegram-autoimport
    paths:
      - .github/banquet-redaction-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/banquet-telegram-autoimport

      - name: Apply patch
        run: python3 .github/patches/apply_banquet_redaction.py

      - name: Validate
        shell: bash
        run: |
          git diff --check
          node --test tests/banquets/v16_banquets_upgrade.test.js
          grep -q "function redactBanquetContactData_" apps-script/stock/production/Code.gs

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/stock/production/Code.gs tests/banquets/v16_banquets_upgrade.test.js
          git commit -m "fix: redact contacts from banquet autoimport"
          git push origin HEAD:feature/banquet-telegram-autoimport
