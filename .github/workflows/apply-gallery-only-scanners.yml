name: Repair gallery-only scanner change

on:
  push:
    branches:
      - fix/remove-scanner-camera

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-scanner-camera

      - name: Restore shared OCR helper and validate camera removal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          helper="""function canvasToJpegDataUrl_(canvas,quality=.94){
            return new Promise((resolve,reject)=>{
              if(!canvas.toBlob){try{resolve(canvas.toDataURL('image/jpeg',quality));}catch(err){reject(err);}return;}
              canvas.toBlob(blob=>{
                if(!blob){reject(new Error('Не удалось сохранить изображение'));return;}
                const reader=new FileReader();
                reader.onload=()=>resolve(String(reader.result||''));
                reader.onerror=()=>reject(new Error('Не удалось прочитать изображение'));
                reader.readAsDataURL(blob);
              },'image/jpeg',quality);
            });
          }

          """
          if 'function canvasToJpegDataUrl_' not in text:
              marker='async function dataUrlToOcrImage_('
              if marker not in text: raise SystemExit('OCR conversion marker missing')
              text=text.replace(marker,helper+marker,1)
          required=['id="receiptGallery"','id="cashReportGallery"','appendReceiptFiles','appendCashReportFiles','function canvasToJpegDataUrl_','async function dataUrlToOcrImage_','id="banqPhotoCamera"']
          for token in required:
              if token not in text: raise SystemExit('missing required path: '+token)
          forbidden=['receiptCamera','receiptReshoot','cashReportCameraFallback','getUserMedia','ImageCapture']
          leftovers=[x for x in forbidden if x in text]
          if leftovers: raise SystemExit('camera leftovers: '+', '.join(leftovers))
          if text.count('capture="environment"') != 1: raise SystemExit('banquet camera must be the only capture input')
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          grep -q 'function canvasToJpegDataUrl_' index.html
          grep -q 'async function dataUrlToOcrImage_' index.html
          ! grep -q 'getUserMedia' index.html
          test "$(grep -o 'capture="environment"' index.html | wc -l)" -eq 1

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No repair needed"
          else
            git add index.html
            git commit -m "fix: preserve gallery OCR image helper"
            git push origin HEAD:fix/remove-scanner-camera
          fi
