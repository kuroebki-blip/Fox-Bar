name: diagnostic-stock-rendering-main

on:
  push:
    branches:
      - diagnostic/stock-rendering-main

jobs:
  test-stock-rendering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Run stock rendering test
        run: node --test tests/fox/stock_rendering.test.cjs
