name: diagnostic-main-tests

on:
  push:
    branches:
      - diagnostic/stock-rendering-main

jobs:
  reproduce-main-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run existing tests except banquet allowlist and capture output
        shell: bash
        run: |
          set +e
          mapfile -d '' test_files < <(find tests -type f \( -name '*.test.js' -o -name '*.test.cjs' \) ! -path 'tests/banquets/v16_banquets_upgrade.test.js' -print0)
          node --test "${test_files[@]}" > main-tests.log 2>&1
          code=$?
          echo "$code" > main-tests.exitcode
          cat main-tests.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: main-tests-log
          path: |
            main-tests.log
            main-tests.exitcode
