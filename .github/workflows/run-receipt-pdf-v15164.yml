name: receipt-pdf-v15164

on:
  push:
    branches:
      - fix/receipt-pdf-upload-v15164

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/receipt-pdf-upload-v15164
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/receipt_pdf_v15164.py
      - name: Test scanner
        run: node --test tests/receipts/scanner_polling_resilience.test.js
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint:check
      - name: Commit result
        run: |
          rm -f .github/workflows/receipt-pdf-v15164.yml .github/workflows/run-receipt-pdf-v15164.yml .github/scripts/receipt_pdf_v15164.py .receipt-pdf-v15164-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: compact FO'X Telegram PDF upload"
          git push origin HEAD:fix/receipt-pdf-upload-v15164
