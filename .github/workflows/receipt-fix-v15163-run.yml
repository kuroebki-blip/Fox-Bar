name: Run receipt scanner patch

on:
  push:
    branches:
      - fix/receipt-scanner-v15163

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/receipt-scanner-v15163
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/receipt_patch_v15163.py
      - name: Test
        run: node --test tests/receipts/scanner_polling_resilience.test.js
      - name: Commit
        run: |
          rm -f .github/workflows/receipt-fix-v15163.yml .github/workflows/receipt-fix-v15163-run.yml tools/receipt_patch_v15163.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: stabilize FO'X receipt scanner polling"
          git push origin HEAD:fix/receipt-scanner-v15163
