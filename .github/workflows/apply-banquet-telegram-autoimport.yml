name: Apply banquet Telegram autoimport patch

on:
  push:
    branches:
      - feature/banquet-telegram-autoimport
    paths:
      - .github/banquet-autoimport-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/banquet-telegram-autoimport

      - name: Apply patch
        run: python3 .github/patches/apply_banquet_telegram_autoimport.py

      - name: Validate
        shell: bash
        run: |
          git diff --check
          node --test tests/banquets/v16_banquets_upgrade.test.js
          grep -q "v9.11.0 BANQUET TELEGRAM AUTOIMPORT" apps-script/stock/production/Code.gs
          grep -q "function foxBanquetsConfigureTelegramWebhook" apps-script/stock/production/Code.gs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/stock/production/Code.gs tests/banquets/v16_banquets_upgrade.test.js CHANGELOG.md docs/Banquets.md
          git commit -m "feat: autoimport banquets from Telegram"
          git push origin HEAD:feature/banquet-telegram-autoimport
