name: cash-report-keyboard-v15165

on:
  push:
    branches:
      - fix/cash-report-keyboard-v15165

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/cash-report-keyboard-v15165
          fetch-depth: 0

      - name: Apply scoped cash report fix
        run: |
          node scripts/patch_cash_report_keyboard_v15165.cjs
          node scripts/write_cash_report_keyboard_test.cjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cash report regression test
        run: node --test tests/fox/cash_report_keyboard.test.cjs

      - name: Run existing repository tests except known banquet allowlist test
        shell: bash
        run: |
          mapfile -d '' test_files < <(find tests -type f \( -name '*.test.js' -o -name '*.test.cjs' \) ! -path 'tests/banquets/v16_banquets_upgrade.test.js' -print0)
          node --test "${test_files[@]}"

      - name: Confirm only the pre-existing banquet allowlist failure remains
        shell: bash
        run: |
          set +e
          node --test tests/banquets/v16_banquets_upgrade.test.js > /tmp/banquet-test.log 2>&1
          code=$?
          set -e
          cat /tmp/banquet-test.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          grep -q 'unexpected Telegram source URL in apps-script/stock/production/Code.gs: https://app.estimates.guru/snapshot/' /tmp/banquet-test.log
          grep -q '# fail 1' /tmp/banquet-test.log
          echo 'Verified: the only banquet-suite failure is the pre-existing Estimates Guru allowlist assertion on main.'

      - name: Run lint
        run: pnpm lint:check

      - name: Validate diff and secrets
        shell: bash
        run: |
          git add index.html CHANGELOG.md tests/fox/cash_report_keyboard.test.cjs
          git diff --cached --check
          pattern='AIza[0-9A-Za-z_-]{30,}|[0-9]{8,10}:[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|cloudinary://[^[:space:]]+'
          if git diff --cached --name-only -z | xargs -0 grep -El "$pattern"; then
            echo 'Potential secret pattern found in changed files.'
            exit 1
          fi

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: dismiss FO'X cash report keyboard"
          git push origin HEAD:fix/cash-report-keyboard-v15165
