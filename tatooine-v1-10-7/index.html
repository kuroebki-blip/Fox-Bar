<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Tatooine</title>
</head>
<body>
  <script>
    (async function () {
      const releaseRoot = '../tatooine/';
      const response = await fetch(releaseRoot + 'index.html?release=1.10.7', { cache: 'no-store' });
      if (!response.ok) throw new Error('Не удалось загрузить Tatooine.');
      const html = (await response.text()).replace('<head>', '<head><base href="' + releaseRoot + '">');
      document.open();
      document.write(html);
      document.close();
    })().catch(function () {
      document.body.textContent = 'Не удалось открыть приложение. Закройте и откройте его снова.';
    });
  </script>
</body>
</html>
